<!-- Interactive q-lattice: visual-first, accessible controls -->
<section class="q-lattice" aria-label="Interactive q-discrete ensemble">
    <div class="q-lattice__visual" id="latticeVisual">
      <canvas id="latticeCanvas" tabindex="0" role="img"
        aria-label="Particles and always-visible limiting density on a two-sided q-lattice. Click a lattice point to pin it. Press Enter to resample."></canvas>
      <div class="q-lattice__actions">
        <button id="latticePlay" class="q-lattice__button" type="button" aria-label="Pause animation" title="Pause animation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        </button>
        <button id="latticeResample" class="q-lattice__button" type="button" aria-label="Resample particles" title="Resample particles">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4.9 16a8 8 0 0 0 13.8 2.1M19.1 8A8 8 0 0 0 5.3 5.9"/><path d="M4 17v-5h5"/></svg>
        </button>
      </div>
    </div>
    <div class="q-lattice__controls">
      <label for="latticeLambda" class="visually-hidden">Deformation parameter lambda</label>
      <div class="q-lattice__range-wrap">
        <input id="latticeLambda" class="q-lattice__range" type="range" min="0.12" max="1.85" step="0.01" value="0.32" aria-label="Deformation parameter lambda">
      </div>
      <div class="q-lattice__marks" aria-hidden="true">
        <span id="latticeCrit1" class="q-lattice__mark"></span>
        <span id="latticeCrit2" class="q-lattice__mark"></span>
      </div>
    </div>
    <p id="latticeAnnounce" class="visually-hidden" aria-live="polite"></p>
  </section>
